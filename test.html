<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Game</title>
	<script type="module">

		const canvas = document.getElementById("canvas");
		const ctx = canvas.getContext("2d");
		ctx.font = "20px Arial";

		let focused = false;
		let mousePresent = false;
		let mouseX = 0;
		let mouseY = 0;
		let scroll = 0;

		let keystates = {};

		canvas.addEventListener("keydown", function (event) {
			keystates[event.code] = true;
		});

		canvas.addEventListener("keyup", function (event) {
			keystates[event.code] = false;
		});

		canvas.addEventListener("mousedown", function (event) {
			if (event.button == 0)
				keystates["Mouse"] = true;
		});

		canvas.addEventListener("mouseup", function (event) {
			if (event.button == 0)
				keystates["Mouse"] = false;
		});

		canvas.addEventListener("mousemove", function (event) {
			mouseX = event.clientX - canvas.offsetLeft;
			mouseY = event.clientY - canvas.offsetTop;
		});

		canvas.addEventListener("wheel", function (event) {
			scroll = event.deltaY;
		});

		canvas.addEventListener("mouseenter", (event) => mousePresent = true);
		canvas.addEventListener("mouseleave", (event) => mousePresent = false);

		canvas.addEventListener("focus", (event) => focused = true);
		canvas.addEventListener("blur", (event) => focused = false);

		setInterval(() => {

			ctx.fillStyle = "#FFF";
			ctx.fillRect(0, 0, 600, 300);
			ctx.fillStyle = "#000";
			ctx.fillText(`Focused: ${ focused }`, 0, 20);
			ctx.fillText(`Mouse present: ${ mousePresent }`, 0, 40);
			ctx.fillText(`Mouse pos: ${ mouseX } ${ mouseY }`, 0, 60);
			ctx.fillText(`Scroll: ${ scroll }`, 0, 80);

			let i = 0;
			for (const k of Object.keys(keystates)) {

				if (keystates[k]) {
					ctx.fillText(k, 0, 100 + i * 20);
					i++;
				}
			}

			scroll = 0;

		}, 1000.0 / 60);
	</script>
</head>
<body style="background: black; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;">
	<canvas id="canvas" width="600" height="300" tabindex="0" style="height: 50vw; width: 100vw; max-height: 100vh; max-width: 200vh; image-rendering: crisp-edges;"></canvas>
</body>
</html>
